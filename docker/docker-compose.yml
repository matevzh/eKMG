# Local development database. Brings up a disposable Postgres that matches the
# values in apps/api/.env, so `dev` never touches the Railway production DB.
#
#   docker compose -f docker/docker-compose.yml up -d     # start
#   docker compose -f docker/docker-compose.yml down      # stop (keeps data)
#   docker compose -f docker/docker-compose.yml down -v   # stop + wipe data
services:
  postgres:
    image: postgres:16-alpine
    container_name: krave-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kmetija
    ports:
      - "5432:5432"
    volumes:
      - krave-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kmetija"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  krave-dev-db-data:
